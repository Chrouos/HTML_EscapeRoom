          replaceExact('game/terminalEngine.js', String.raw`function entryVisible(room, role, entry) {
            if (entry.archiveOnly && !room.workstation[role].unzippedArchiveIds?.includes(entry.archiveId)) return false;`, String.raw`function entryVisible(room, role, entry) {
