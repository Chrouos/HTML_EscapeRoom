name: Reconcile Master Runtime

on:
  push:
    branches:
      - feat/reactive-narrative-reveal-20260924-active

permissions:
  contents: write

jobs:
  reconcile:
    if: "${{ github.event.head_commit.message == 'chore: run master reconciliation' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Normalize reconciliation generator
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('scripts/reconcile-master-runtime.js')
          s = p.read_text()
          s = s.replace("ws.appliedMutationIds.push(`${mutation.command}:${target.id}`);", "ws.appliedMutationIds.push(mutation.command + ':' + target.id);")
          s = s.replace("const mutationId = `${mutation.command}:${target.id}`;", "const mutationId = mutation.command + ':' + target.id;")
          s = s.replace("    hintsByRole: { A: {}, B: {} },\n", '')
          s = s.replace("filename: 'hidden_audit.log', mutationOnly: true,", "filename: 'hidden_audit.log', contentFile: 'private-a/hidden_audit.log', mutationOnly: true,")
          s = s.replace("filename: 'local_mirror.tmp', deletable: true,", "filename: 'local_mirror.tmp', contentFile: 'private-a/local_mirror.tmp', deletable: true,")
          s = s.replace("filename: 'recovered_note.md', mutationOnly: true,", "filename: 'recovered_note.md', contentFile: 'private-b/recovered_note.md', mutationOnly: true,")
          p.write_text(s)
          PY
      - name: Apply reconciliation patch
        run: node scripts/reconcile-master-runtime.js
      - name: Normalize generated source and create mutation files
        run: |
          python <<'PY'
          from pathlib import Path
          terminal = Path('game/content/terminalEntries.js')
          source = terminal.read_text().replace('\\`', '`')
          source = source.replace(']);\n\nmodule.exports = { terminalEntries };]);\n\nmodule.exports = { terminalEntries };', ']);\n\nmodule.exports = { terminalEntries };')
          terminal.write_text(source)
          files = {
              'game/content/files/private-a/hidden_audit.log': 'A 端隱藏稽核備註\n\n這份備註沒有出現在一般索引，只保留了研究員對「誰可以替誰簽核」的疑問。它不是出口指令，而是一段用來確認權限來源的原始記錄。\n',
              'game/content/files/private-a/local_mirror.tmp': 'A 端本地鏡像暫存\n\n這份副本只供比對使用。刪除它不會影響共同檔案，但會在稽核紀錄留下操作痕跡；若要恢復，必須保留原本的權限。\n',
              'game/content/files/private-b/recovered_note.md': 'B 端恢復備註\n\n這份文件只會在 B 端取得寫入權限後出現。它記錄鏡像恢復時不可省略的人工覆核欄位，不能取代主線答案。\n'
          }
          for filename, content in files.items():
              path = Path(filename)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content)
          room_state = Path('game/createRoomState.js').read_text()
          assert 'hintsByRole:' not in room_state, 'initial room shape unexpectedly contains hintsByRole'
          generated = terminal.read_text()
          for expected in ('private-a/hidden_audit.log', 'private-a/local_mirror.tmp', 'private-b/recovered_note.md'):
              assert expected in generated, 'missing generated contentFile: ' + expected
          PY
      - name: Install dependencies
        run: npm ci
      - name: Validate content
        run: npm run validate:content
      - name: Run unit and integration tests
        run: npm test
      - name: Commit reconciled runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/reconcile-master-runtime.yml
          git rm -f scripts/reconcile-master-runtime.js
          git add game/createRoomState.js game/gameEngine.js game/content/story.js game/content/terminalEntries.js game/terminalEngine.js game/content/files/private-b/recovered_note.md
          git add -f game/content/files/private-a/hidden_audit.log game/content/files/private-a/local_mirror.tmp
          git commit -m "fix: reconcile master runtime behavior"
          git push origin HEAD:feat/reactive-narrative-reveal-20260924-active
