          const fs = require('fs');

          function replaceExact(path, before, after) {
            const source = fs.readFileSync(path, 'utf8');
            const first = source.indexOf(before);
            if (first < 0) throw new Error(`Patch anchor missing in ${path}: ${before.slice(0, 80)}`);
            if (source.indexOf(before, first + 1) >= 0) throw new Error(`Patch anchor is ambiguous in ${path}`);
            fs.writeFileSync(path, source.slice(0, first) + after + source.slice(first + before.length));
          }

          function insertBeforeLast(path, marker, addition) {
            const source = fs.readFileSync(path, 'utf8');
            const index = source.lastIndexOf(marker);
            if (index < 0) throw new Error(`Final marker missing in ${path}`);
            fs.writeFileSync(path, source.slice(0, index) + addition + source.slice(index));
