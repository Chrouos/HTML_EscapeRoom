name: Reconcile Master Runtime

on:
  push:
    branches:
      - feat/reactive-narrative-reveal-20260924-active

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.head_commit.message == 'chore: run master reconciliation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply reconciliation patch
        run: node scripts/reconcile-master-runtime.js
      - name: Install dependencies
        run: npm ci
      - name: Validate content
        run: npm run validate:content
      - name: Run unit and integration tests
        run: npm test
      - name: Commit reconciled runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/reconcile-master-runtime.yml scripts/reconcile-master-runtime.js
          git add game/createRoomState.js game/gameEngine.js game/content/story.js game/content/terminalEntries.js game/terminalEngine.js
          git commit -m "fix: reconcile master runtime behavior"
          git push origin HEAD:feat/reactive-narrative-reveal-20260924-active
