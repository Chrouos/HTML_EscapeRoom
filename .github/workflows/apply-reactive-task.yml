name: Apply Reactive Task Patch

on:
  push:
    paths:
      - 'scripts/apply-reactive-task.js'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply authored patch
        shell: bash
        run: |
          if [ ! -f scripts/apply-reactive-task.js ]; then
            echo 'No patch script present; nothing to apply.'
            exit 0
          fi
          node scripts/apply-reactive-task.js
          if git diff --quiet; then
            echo 'Patch produced no changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: align Unit 17 reveal pacing with canon'
          git push origin HEAD:${{ github.ref_name }}
