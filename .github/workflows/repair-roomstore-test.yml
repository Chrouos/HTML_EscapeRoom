name: Repair RoomStore Test

on:
  push:
    paths:
      - 'scripts/repair-roomstore-test.js'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - run: git fetch origin new_open
      - run: node scripts/repair-roomstore-test.js
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/unit/roomStore.test.js scripts/repair-roomstore-test.js
          git commit -m 'test: restore room store suite with narrative behavior contract'
          git push origin HEAD:${{ github.ref_name }}
